[project]
name = "minimind"
version = "0.1.0"
description = "MiniMind project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "torch>=2.9.0",
    "transformers>=4.57.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"